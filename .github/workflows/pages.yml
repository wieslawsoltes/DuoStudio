name: Build and deploy Duo Studio
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: duo-studio-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build standalone app, PWA and source checks
        run: |
          python3 scripts/build.py
          node scripts/check.mjs
      - name: Install browser test tools
        run: |
          python3 -m pip install -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium
          python3 - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write('CHROMIUM=' + p.chromium.executable_path + '\n')
          PY
      - name: Original app regressions
        run: python3 tests/test_browser.py --chromium "$CHROMIUM"
      - name: Creative apps, engines and simulator regressions
        run: python3 tests/test_creative.py --chromium "$CHROMIUM"
      - name: Hosted storage, WebGPU and offline installation
        run: python3 tests/test_hosted.py --chromium "$CHROMIUM"
      - name: Capture real simulator gallery
        run: python3 scripts/capture_v2.py --chromium "$CHROMIUM"
      - name: Package complete downloadable source
        run: python3 scripts/package_repository.py
      - name: Stage site
        run: |
          mkdir -p _site/downloads _site/screenshots
          cp dist/* _site/
          cp releases/* _site/downloads/
          cp duo-studio-preview.png _site/
          cp screenshots/*.png _site/screenshots/
          cp -R docs _site/docs
          touch _site/.nojekyll
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            tests/*report.json
            tests/export-fixture.*
            screenshots/failure-*.png
          if-no-files-found: ignore
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy simulator
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record deployment URL
        run: echo 'Duo Studio — ${{ steps.deployment.outputs.page_url }}' >> "$GITHUB_STEP_SUMMARY"
