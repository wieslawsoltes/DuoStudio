name: Apply verified sources
on:
  push:
    branches: ['feat/creative-os-2', 'feat/duokit-ide']
    paths: ['.changes/READY']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply source payload
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path, PurePosixPath
          packed = base64.b64decode(''.join(p.read_text().strip() for p in sorted(Path('.changes').glob('*.b64'))), validate=True)
          assert hashlib.sha256(packed).hexdigest() == Path('.changes/READY').read_text().strip(), 'Transfer checksum mismatch'
          payload = json.loads(gzip.decompress(packed))
          for name, text in payload['files'].items():
              p = PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and p.parts[0] in {'src','sdk','vendor','scripts','tests','docs','README.md','package.json','.gitignore'}, name
              target = Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text)
          print('Applied', len(payload['files']), 'verified source files')
          PY
          python3 scripts/build.py
          node scripts/check.mjs
      - name: Commit readable source update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm -r .changes
          git commit -m 'feat: apply verified readable source updates and rebuild standalone distribution'
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:${GITHUB_REF_NAME}"
