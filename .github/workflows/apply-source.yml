name: Apply verified sources
on:
  push:
    branches: [feat/duokit-ide]
    paths: [.changes/FINISH]
permissions:
  contents: write
concurrency:
  group: duo-sdk-source-recovery
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore checksum-verified readable sources
        run: python3 scripts/finish-sdk-recovery.py
      - name: Vendor pinned parser and migrate all application SDK contracts
        run: |
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/duokit-tools" acorn@8.15.0 typescript@5.8.3
          mkdir -p vendor
          cp "$RUNNER_TEMP/duokit-tools/node_modules/acorn/dist/acorn.js" vendor/acorn.js
          cp "$RUNNER_TEMP/duokit-tools/node_modules/acorn/LICENSE" vendor/ACORN-LICENSE
          echo 'fdb08546776ec6228b03e8d02b40d4ab3255bae5f401adba7ff5dad927ac5c9c  vendor/acorn.js' | sha256sum --check
          DUOKIT_TYPESCRIPT="$RUNNER_TEMP/duokit-tools/node_modules/typescript" node scripts/migrate_sdk_apps.cjs
          python3 scripts/build.py
          node scripts/check.mjs
          node tests/test_sdk.mjs
          "$RUNNER_TEMP/duokit-tools/node_modules/.bin/tsc" --noEmit --strict --lib ES2022,DOM sdk/index.d.ts
      - name: Install browser validation tools
        run: |
          python3 -m pip install -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium
          python3 - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write('CHROMIUM=' + p.chromium.executable_path + '\n')
          PY
      - name: Original app regressions
        run: python3 tests/test_browser.py --chromium "$CHROMIUM"
      - name: Creative engines and simulator regressions
        run: python3 tests/test_creative.py --chromium "$CHROMIUM"
      - name: SDK and IDE authoring, visual editing and debugging
        run: python3 tests/test_ide.py --chromium "$CHROMIUM"
      - name: Hosted WebGPU, storage and offline edited-app runs
        run: python3 tests/test_hosted.py --chromium "$CHROMIUM"
      - name: Capture real developer studio gallery
        run: python3 scripts/capture_v3.py --chromium "$CHROMIUM"
      - name: Remove one-time transfer tools and package complete distribution
        run: |
          git rm -r --ignore-unmatch .changes .github/workflows/apply-source.yml .github/workflows/recover-sdk.yml scripts/finish-sdk-recovery.py
          mkdir -p releases
          cd sdk && npm pack --ignore-scripts --pack-destination ../releases && cd ..
          python3 scripts/package_repository.py
      - name: Commit SDK, all migrated apps, IDE and verified distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: extract DuoKit SDK, migrate twenty apps and add live developer studio'
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload source and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-source-validation
          path: |
            tests/*report.json
            screenshots/failure-*.png
            screenshots/v3-*.png
            releases/*
          if-no-files-found: ignore
