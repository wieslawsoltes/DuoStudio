name: Import creative studio sources
on:
  push:
    branches: [feat/creative-os-2]
    paths: ['.import-v2/READY']
permissions:
  contents: write
concurrency:
  group: duo-creative-source-import
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/feat/creative-os-2'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore verified readable sources
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, lzma, tarfile
          from pathlib import Path, PurePosixPath
          parts = sorted(Path('.import-v2').glob('*.b64'))
          if [p.name for p in parts] != [f'{i:02}.b64' for i in range(11)]:
              raise SystemExit('Source transfer must contain exactly eleven ordered parts')
          data = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          if hashlib.sha256(data).hexdigest() != '8d759fe0917cd7f897b7ce823b79e18c4e6ce24fdbe5d4a690abca5a584186e4':
              raise SystemExit('Source transfer SHA-256 mismatch')
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(data)), mode='r:') as archive:
              members = archive.getmembers()
              if len(members) != 42:
                  raise SystemExit('Expected 42 source files')
              for member in members:
                  path = PurePosixPath(member.name)
                  if not member.isfile() or path.is_absolute() or '..' in path.parts:
                      raise SystemExit('Unsafe source archive entry')
                  if path.parts[0] not in {'src', 'scripts', 'docs', 'tests', 'README.md', 'package.json', '.gitignore'}:
                      raise SystemExit('Unexpected source root: ' + member.name)
              archive.extractall('.', filter='data')
          print('Restored all 42 original source files; SHA-256 verified.')
          PY
      - name: Build and validate sources
        run: |
          python3 scripts/build.py
          node scripts/check.mjs
      - name: Install browser tools
        run: |
          python3 -m pip install -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium
          python3 - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write('CHROMIUM=' + p.chromium.executable_path + '\n')
          PY
      - name: Run original and creative app regressions
        run: |
          python3 tests/test_browser.py --chromium "$CHROMIUM"
          python3 tests/test_creative.py --chromium "$CHROMIUM"
      - name: Generate gallery and offline distributions
        run: |
          python3 scripts/capture_v2.py --chromium "$CHROMIUM"
          python3 scripts/package_repository.py
      - name: Commit full readable sources to feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts docs tests screenshots dist releases README.md package.json .gitignore duo-studio.html duo-studio-preview.png
          git rm -r .import-v2
          git commit -m 'feat: add ten creative apps, full simulator shell, portable projects and validated offline distribution'
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:feat/creative-os-2
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creative-import-validation
          path: |
            tests/*report.json
            tests/export-fixture.*
            screenshots/failure-*.png
          if-no-files-found: ignore
