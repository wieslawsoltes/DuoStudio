name: Source snapshot
on:
  push:
    branches: ['feat/creative-os-2', 'feat/duokit-ide']
    paths: ['.github/workflows/source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: git archive --format=zip HEAD -o source-snapshot.zip
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: source-snapshot.zip
          retention-days: 7
